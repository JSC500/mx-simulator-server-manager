services:
  mxserver:
    build: .
    platform: linux/amd64          # mxserver is a 32-bit x86 binary
    image: mxserver:latest
    container_name: mxserver
    restart: unless-stopped
    ports:
      - "8080:8080"                # the web app
      - "19800-19809:19800-19809/udp"  # one port per game server; keep in sync with MX_PORTS
    volumes:
      - ./data:/data
    environment:
      - WEB_USERNAME=${WEB_USERNAME:-admin}   # set by setup.sh in .env
      - WEB_PASSWORD=${WEB_PASSWORD:-}
      - MX_PORTS=19800-19809
