<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add server · MX Simulator Server Manager</title>
<link rel="preconnect" href="https://fonts.bunny.net">
<link rel="stylesheet" href="https://fonts.bunny.net/css?family=pixelify-sans:400,600,700|ibm-plex-sans:400,500,600|ibm-plex-mono:400,500,600&display=swap">
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="scrim" style="padding-top:56px">
  <form class="dialog dialog-narrow" role="dialog" aria-modal="true" aria-labelledby="add-title" id="form">
    <div class="dialog-bar">
      <h1 id="add-title"></h1>
      <a class="dialog-close" id="close" href="/" aria-label="Close"></a>
    </div>
    <div class="dialog-body" style="gap:20px">
      <label class="lbl">Server name
        <input class="field" type="text" id="name" maxlength="60" placeholder="e.g. EU Practice 2" required>
      </label>
      <div class="grid-2" style="gap:16px">
        <label class="lbl">UDP port
          <input class="field mono" type="number" id="port" required>
          <small id="port-hint">Next free port. Open it in your VPS firewall.</small>
        </label>
        <label class="lbl">Max clients
          <input class="field mono" type="number" id="max-clients" min="1" value="10">
        </label>
      </div>
      <div class="stack-sm">
        <span id="start-from" style="font-size:14px;font-weight:600">Start from</span>
        <div role="radiogroup" aria-labelledby="start-from" style="display:flex;flex-wrap:wrap;gap:10px">
          <button class="opt" type="button" role="radio" data-mode="defaults" aria-checked="true">
            <b>Defaults</b>
            <span>5 laps · 15 min interval · Rabbit Hill</span>
          </button>
          <button class="opt" type="button" role="radio" data-mode="copy" aria-checked="false">
            <b>Copy a server</b>
            <span>Settings, tracks, marshals, bans</span>
          </button>
        </div>
        <select class="field" id="copy-from" aria-label="Server to copy" hidden></select>
      </div>
      <label class="lbl">Admin password (in-game)
        <span class="pw" id="password-wrap"><input class="field mono" type="password" id="password" placeholder="Choose a password" autocomplete="new-password"></span>
        <small>Leave it empty to keep the password of the defaults or the copied server.</small>
      </label>
      <label style="display:flex;gap:10px;align-items:center;min-height:44px;font-size:14px">
        <input type="checkbox" id="start" checked style="width:22px;height:22px"> Start the server right away
      </label>
    </div>
    <div class="dialog-foot">
      <a class="btn" href="/" id="cancel">Cancel</a>
      <button class="btn btn-pri" type="submit" id="create">Create server</button>
    </div>
  </form>
</div>
<script src="/common.js"></script>
<script src="/add.js"></script>
</body>
</html>
